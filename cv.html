<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV — Michael T. Kiley</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --surface-page: #eef1f4;
      --surface-card: #ffffff;
      --rule:         #dde3e8;
      --rule-soft:    #e8ecef;
      --ink:          #10151d;
      --ink-secondary:#4b5568;
      --ink-muted:    #7c8698;
      --accent-text:  #1c5cab;
      --accent-lt:    #e8edf4;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --surface-page: #12161c;
        --surface-card: #191f27;
        --rule:         #2a323d;
        --rule-soft:    #212933;
        --ink:          #f2f4f7;
        --ink-secondary:#b7c0cc;
        --ink-muted:    #7c8798;
        --accent-text:  #74aeef;
        --accent-lt:    #1c2a3a;
      }
    }
    :root[data-theme="dark"] {
      --surface-page: #12161c;
      --surface-card: #191f27;
      --rule:         #2a323d;
      --rule-soft:    #212933;
      --ink:          #f2f4f7;
      --ink-secondary:#b7c0cc;
      --ink-muted:    #7c8798;
      --accent-text:  #74aeef;
      --accent-lt:    #1c2a3a;
    }

    html { font-size: 17px; }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 400;
      background: var(--surface-page);
      color: var(--ink);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* ---- shared site nav (same on every page of the site) ---- */
    .site-nav { border-bottom: 1px solid var(--rule); background: var(--surface-card); }
    .site-nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .site-nav .wordmark {
      font-family: 'Newsreader', Georgia, serif;
      font-weight: 500;
      font-size: 17px;
      color: var(--ink);
      text-decoration: none;
    }
    .site-nav nav { display: flex; gap: 20px; }
    .site-nav nav a {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--ink-secondary);
      text-decoration: none;
    }
    .site-nav nav a:hover, .site-nav nav a.active { color: var(--accent-text); }

    /* ---- page masthead (identity, unique to this page) ---- */
    header.masthead {
      border-bottom: 1px solid var(--rule);
      padding: 2.8rem 0 2rem;
    }

    .name {
      font-family: 'Newsreader', serif;
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--ink);
      line-height: 1.2;
    }

    .title-line {
      margin-top: 0.35rem;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--ink-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      padding: 2.2rem 0 4rem;
    }

    .cv-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .download-link {
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--accent-text);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-lt);
      transition: border-color 0.15s;
    }

    .download-link:hover { border-color: var(--accent-text); }

    .cv-frame {
      width: 100%;
      height: 80vh;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: var(--surface-card);
    }

    footer {
      border-top: 1px solid var(--rule);
      padding: 1.4rem 0;
      font-size: 0.78rem;
      color: var(--ink-muted);
    }

    @media (max-width: 480px) {
      .name { font-size: 1.7rem; }
      .cv-frame { height: 70vh; }
    }
  </style>
</head>
<body>

  <div class="site-nav">
    <div class="site-nav-inner">
      <a class="wordmark" href="https://michaeltkiley.github.io/">Michael T. Kiley</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="cv.html" class="active">CV</a>
        <a href="https://michaeltkiley.github.io/termprem/">Yield Curve Tracker</a>
        <a href="https://michaeltkiley.github.io/monetary_policy_surprises/">Monetary Policy Expectations</a>
        <a href="https://michaeltkiley.github.io/resource_utilization/">Resource Utilization and Risk</a>
        <a href="https://michaeltkiley.github.io/equilibrium_rate/">Equilibrium Real Interest Rate</a>
      </nav>
    </div>
  </div>

  <header class="masthead">
    <div class="container">
      <div class="name">Michael T. Kiley</div>
      <div class="title-line">Economist &mdash; Federal Reserve Board</div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="cv-toolbar">
        <div class="section-label">Curriculum Vitae</div>
        <a class="download-link"
           href="https://docs.google.com/document/d/1xLSJa52b5WTh0I6sZohYJhHeE966QmUa4PfVhFRyemI/export?format=pdf"
           target="_blank" rel="noopener">Download PDF</a>
      </div>
      <iframe
        class="cv-frame"
        src="https://docs.google.com/document/d/1xLSJa52b5WTh0I6sZohYJhHeE966QmUa4PfVhFRyemI/preview"
        title="Michael T. Kiley — Curriculum Vitae"
        allowfullscreen>
      </iframe>
    </div>
  </main>

  <footer>
    <div class="container">
      Updated June 2026
    </div>
  </footer>

</body>
</html>
